name: ci

# NOTE: main への push と PR で lint / typecheck / test / e2e / generate を回す。
#       generate まで回すのは、 GitHub Pages 用の静的ビルドが壊れていないかを CD の前に知るため。
#       cd.yml はこの workflow が main で成功したときだけ (workflow_run で) 動く。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup node env 🏗
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies 👨🏻‍💻
        run: yarn install --frozen-lockfile

      - name: Run linter 👀
        run: yarn lint

      - name: Run type check 🔍
        run: yarn typecheck

      - name: Run tests 🧪
        run: yarn test

      - name: Install Chromium for e2e 🌐
        run: yarn playwright-core install --with-deps chromium

      - name: Run e2e tests (build + Chromium) 🧭
        run: yarn test:e2e

      - name: Run generate (GitHub Pages 設定でビルドできるか確認) 👷
        # NOTE: set -a で .github-pages.env の変数を export してから generate する。
        run: |
          set -a; . ./.github-pages.env; set +a
          yarn generate
