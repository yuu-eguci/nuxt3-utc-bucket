name: ci

# NOTE: main への push と PR で lint / typecheck / test / generate を回す。
#       generate まで回すのは、 GitHub Pages 用の静的ビルドが壊れていないかを CD の前に知るため。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup node env 🏗
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies 👨🏻‍💻
        run: yarn install --frozen-lockfile

      - name: Run linter 👀
        run: yarn lint

      - name: Run type check 🔍
        run: yarn typecheck

      - name: Run tests 🧪
        run: yarn test

      - name: Run generate (GitHub Pages 設定でビルドできるか確認) 👷
        run: env $(grep -v '^#' ./.github-pages.env | xargs) yarn generate
