name: cd

# NOTE: main への push では、 ci.yml (lint / typecheck / test / e2e / generate) が成功したときだけ deploy する。
#       https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#workflow_run
on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cd:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup node env 🏗
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies 👨🏻‍💻
        run: yarn install --frozen-lockfile

      - name: Run generate 👷
        # GitHub Pages 環境用の .env を適用してビルド。
        run: env $(grep -v '^#' ./.github-pages.env | xargs) yarn generate

      - name: Deploy to gh-pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: `nuxt generate` の出力先。 ./dist は .output/public への symlink (コンテナ内の絶対パス) なので実体を指定している。
          publish_dir: ./.output/public
          # NOTE: カスタムドメインが導入されることがあればここに cname が設定されます。
